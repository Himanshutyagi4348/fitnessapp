name: detection_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # Core - Vision AI Pose (bundles its own camera + model loading;
  # do NOT also add the standalone `camera` package for this — it's redundant
  # and can conflict with vision_ai_pose's internal camera/texture handling)
  vision_ai_pose: ^0.1.0

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.0

  # Speech
  speech_to_text: ^7.4.0

  # Sensors (for orientation)
  sensors_plus: ^7.1.0

  # State Management (pick one — flutter_riverpod supersedes provider)
  flutter_riverpod: ^3.3.2

  # File handling
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  permission_handler: ^12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Optional: Add heavy model if you want to use it
  # assets:
  #   - assets/pose_landmarker_heavy.task